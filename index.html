<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Macro Matrix">
  <title>Macro Matrix Calculator</title>
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- OCR + Barcode Scanner libs -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>


  <style>
    :root{
      --mm-silhouette: #000000;     /* Silhouette 19-4103 TCX */
      --mm-stalactite: #E6E7E8;     /* Stalactite 11-4101 TCX */
      --mm-secret:     #A7B0B8;     /* Secret Spaces 14-4309 TCX */
      --mm-bluebird:   #F27D9B;     /* Mountain Bluebird 16-4039 TCX */
    }

    body{
      background: var(--mm-silhouette) !important;
      color: var(--mm-stalactite) !important;
    }

    .border-white{ border-color: var(--mm-stalactite) !important; }
    .border{ border-color: var(--mm-stalactite) !important; }

    .text-gray-400, .text-gray-500, .text-gray-300{
      color: var(--mm-stalactite) !important;
      opacity: 0.9;
    }

    #mmTitle{ color: var(--mm-secret) !important; }

    select{
      min-width: 0;
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
    }

    input, select{
      background: transparent !important;
      color: var(--mm-stalactite) !important;
      border: 1px solid var(--mm-stalactite) !important;
    }
    input::placeholder{ color: rgba(230,231,232,0.65); }
    input:focus, select:focus{
      outline: none;
      box-shadow: 0 0 0 2px rgba(230,231,232,0.25);
    }

    .mm-btn{
      background: var(--mm-bluebird) !important;
      color: var(--mm-stalactite) !important;
      border-color: var(--mm-bluebird) !important;
      transition: opacity 0.15s ease, transform 0.12s ease;
    }
    .mm-btn:hover{ opacity: 0.88; }
    .mm-btn:active{ transform: translateY(1px); }

    .hover\:bg-white:hover{ background: var(--mm-bluebird) !important; }
    .hover\:text-black:hover{ color: var(--mm-stalactite) !important; }

    a{ color: var(--mm-stalactite) !important; }
  </style>
</head>

<body class="bg-black text-white min-h-screen font-mono p-4">
  <div class="max-w-md mx-auto border border-white p-4 min-h-screen">
    <!-- Header -->
    <div class="mb-4">
      <div class="flex items-center justify-between">
        <h1 class="text-xl tracking-widest">
          <span id="mmTitle">MACRO MATRIX</span>
        </h1>

        <a href="index.html" class="border border-white px-3 py-2 rounded-lg text-xs hover:bg-white hover:text-black transition"
           aria-label="Back">
          ←
        </a>
      </div>

      <p class="text-gray-400 text-sm mt-1">
        Ingredient vectors, summed against daily targets.
      </p>
    </div>

    <!-- Targets -->
    <div class="border border-white p-3 mb-4 rounded-xl">
      <div class="text-sm tracking-widest mb-2" style="color: var(--mm-secret);">DAILY TARGETS</div>

      <div class="grid grid-cols-3 gap-2">
        <input id="targetProtein" type="number" placeholder="PRO (g)" class="p-2 border border-white" />
        <input id="targetCarbs" type="number" placeholder="CARB (g)" class="p-2 border border-white" />
        <input id="targetFat" type="number" placeholder="FAT (g)" class="p-2 border border-white" />
      </div>

      <button id="saveTargetsBtn" class="mm-btn border border-white w-full mt-2 py-2 rounded-lg text-sm">
        SAVE TARGETS
      </button>
    </div>

    <!-- Meal Controls -->
    <div class="border border-white p-3 mb-4 rounded-xl">
      <div class="text-sm tracking-widest mb-2" style="color: var(--mm-secret);">MEALS</div>

      <div class="flex gap-2 mb-2">
        <input id="mealName" placeholder="MEAL NAME" class="p-2 border border-white flex-1" />
        <button id="saveMealBtn" class="mm-btn border border-white px-3 py-2 rounded-lg text-xs whitespace-nowrap">
          SAVE
        </button>
      </div>

      <div class="flex gap-2">
        <select id="mealSelect" class="p-2 border border-white flex-1 rounded-lg"></select>

        <button id="loadMealBtn" class="mm-btn border border-white px-3 py-2 rounded-lg text-xs whitespace-nowrap">
          LOAD
        </button>

        <button id="deleteMealBtn" class="border border-white px-3 py-2 rounded-lg text-xs whitespace-nowrap hover:bg-white hover:text-black transition">
          DEL
        </button>
      </div>
    </div>

    <!-- Add Ingredient -->
    <div class="border border-white p-3 mb-4 rounded-xl">
      <div class="text-sm tracking-widest mb-2" style="color: var(--mm-secret);">ADD INGREDIENT</div>

      <!-- Input Row -->
      <div class="grid grid-cols-1 gap-2 mb-3">
        <div class="flex gap-2">
        <input id="name" placeholder="INGREDIENT" class="p-2 border border-white flex-1" />
        <button id="scanBtn" class="mm-btn border border-white px-3 py-2 rounded-lg text-xs whitespace-nowrap">SCAN</button>
      </div>
        <div id="results" class="border border-white hidden max-h-40 overflow-y-auto"></div>
        <input id="protein" type="number" placeholder="PROTEIN (g / serving)" class="p-2 border border-white" />
        <input id="carbs" type="number" placeholder="CARBS (g / serving)" class="p-2 border border-white" />
        <input id="fat" type="number" placeholder="FAT (g / serving)" class="p-2 border border-white" />
        <input id="quantity" type="number" value="1" min="1" placeholder="QTY" class="p-2 border border-white" />
        <button id="addBtn" class="border border-white hover:bg-white hover:text-black transition py-3 text-lg mm-btn">ADD</button>
      </div>
    </div>

    <!-- Totals -->
    <div class="border border-white p-3 mb-4 rounded-xl">
      <div class="flex items-center justify-between mb-2">
        <div class="text-sm tracking-widest" style="color: var(--mm-secret);">TOTALS</div>
        <div class="text-xs text-gray-400" id="totalsHint"></div>
      </div>

      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="border border-white p-2 rounded-lg">
          <div class="text-xs text-gray-400">PRO</div>
          <div id="totalProtein" class="text-lg">0</div>
          <div id="diffProtein" class="text-xs text-gray-400">0</div>
        </div>
        <div class="border border-white p-2 rounded-lg">
          <div class="text-xs text-gray-400">CARB</div>
          <div id="totalCarbs" class="text-lg">0</div>
          <div id="diffCarbs" class="text-xs text-gray-400">0</div>
        </div>
        <div class="border border-white p-2 rounded-lg">
          <div class="text-xs text-gray-400">FAT</div>
          <div id="totalFat" class="text-lg">0</div>
          <div id="diffFat" class="text-xs text-gray-400">0</div>
        </div>
      </div>
    </div>

    <!-- Ingredient List -->
    <div class="border border-white p-3 rounded-xl">
      <div class="flex items-center justify-between mb-2">
        <div class="text-sm tracking-widest" style="color: var(--mm-secret);">INGREDIENTS</div>
        <button id="clearBtn" class="border border-white px-3 py-1 rounded-lg text-xs hover:bg-white hover:text-black transition">
          CLEAR
        </button>
      </div>

      <div id="list" class="space-y-2"></div>
    </div>

    <!-- Reset -->
    <button id="resetBtn" class="border border-white w-full mt-4 py-3 rounded-xl text-sm hover:bg-white hover:text-black transition">
      RESET
    </button>
  </div>

<!-- Scanner Modal (Barcode + Label OCR) -->
<div id="scanModal" class="fixed inset-0 hidden z-50">
  <div class="absolute inset-0 bg-black/80"></div>

  <div class="relative mx-auto mt-10 w-[92%] max-w-md border border-white p-3 rounded-xl"
       style="background: var(--mm-silhouette);">
    <div class="flex items-center justify-between mb-2">
      <div class="text-sm tracking-widest" style="color: var(--mm-stalactite);">
        SCAN
      </div>
      <button id="scanClose" class="mm-btn border border-white px-3 py-1 rounded-lg text-xs">CLOSE</button>
    </div>

    <div class="flex gap-2 mb-3">
      <button id="tabBarcode" class="mm-btn border border-white px-3 py-2 rounded-lg text-xs flex-1">BARCODE</button>
      <button id="tabLabel" class="mm-btn border border-white px-3 py-2 rounded-lg text-xs flex-1">LABEL (OCR)</button>
    </div>

    <video id="scanVideo" playsinline autoplay class="w-full rounded-lg border border-white"></video>

    <div class="flex gap-2 mt-3">
      <button id="scanAction" class="mm-btn border border-white px-4 py-3 rounded-lg text-sm flex-1">
        START BARCODE SCAN
      </button>

      <button id="scanUploadBtn" class="mm-btn border border-white px-4 py-3 rounded-lg text-sm hidden">
        UPLOAD
      </button>
      <input id="scanPhotoInput" type="file" accept="image/*" capture="environment" class="hidden">
    </div>

    <div id="scanStatus" class="text-xs text-gray-400 mt-2">
      Barcode mode: point at UPC/EAN and hold steady.
    </div>

    <canvas id="scanCanvas" class="hidden"></canvas>
  </div>
</div>

<script>
  // ----------------------------
  // State
  // ----------------------------
  let ingredients = JSON.parse(localStorage.getItem("ingredients") || "[]");
  let targets = JSON.parse(localStorage.getItem("targets") || '{"protein":0,"carbs":0,"fat":0}');
  let meals = JSON.parse(localStorage.getItem("meals") || "{}");

  // ----------------------------
  // Elements
  // ----------------------------
  const nameInput = document.getElementById('name');
  const proteinInput = document.getElementById('protein');
  const carbsInput = document.getElementById('carbs');
  const fatInput = document.getElementById('fat');
  const qtyInput = document.getElementById('quantity');
  const addBtn = document.getElementById('addBtn');

  const listEl = document.getElementById('list');

  const totalProteinEl = document.getElementById('totalProtein');
  const totalCarbsEl = document.getElementById('totalCarbs');
  const totalFatEl = document.getElementById('totalFat');

  const diffProteinEl = document.getElementById('diffProtein');
  const diffCarbsEl = document.getElementById('diffCarbs');
  const diffFatEl = document.getElementById('diffFat');
  const totalsHintEl = document.getElementById('totalsHint');

  const targetProteinInput = document.getElementById('targetProtein');
  const targetCarbsInput = document.getElementById('targetCarbs');
  const targetFatInput = document.getElementById('targetFat');
  const saveTargetsBtn = document.getElementById('saveTargetsBtn');

  const mealNameInput = document.getElementById('mealName');
  const saveMealBtn = document.getElementById('saveMealBtn');
  const mealSelect = document.getElementById('mealSelect');
  const loadMealBtn = document.getElementById('loadMealBtn');
  const deleteMealBtn = document.getElementById('deleteMealBtn');

  const clearBtn = document.getElementById('clearBtn');
  const resetBtn = document.getElementById('resetBtn');

  const resultsEl = document.getElementById('results');

  // ----------------------------
  // Helpers
  // ----------------------------
  function fmt(n) {
    const v = Number(n) || 0;
    return Math.round(v * 10) / 10;
  }

  function sumTotals() {
    return ingredients.reduce(
      (acc, item) => {
        acc.protein += (Number(item.protein) || 0) * (Number(item.qty) || 1);
        acc.carbs   += (Number(item.carbs) || 0)   * (Number(item.qty) || 1);
        acc.fat     += (Number(item.fat) || 0)     * (Number(item.qty) || 1);
        return acc;
      },
      { protein: 0, carbs: 0, fat: 0 }
    );
  }

  function updateTotalsUI() {
    const totals = sumTotals();

    totalProteinEl.textContent = fmt(totals.protein);
    totalCarbsEl.textContent   = fmt(totals.carbs);
    totalFatEl.textContent     = fmt(totals.fat);

    const dp = fmt((targets.protein || 0) - totals.protein);
    const dc = fmt((targets.carbs || 0) - totals.carbs);
    const df = fmt((targets.fat || 0) - totals.fat);

    diffProteinEl.textContent = (targets.protein ? (dp >= 0 ? `-${dp}` : `+${Math.abs(dp)}`) : "0");
    diffCarbsEl.textContent   = (targets.carbs ? (dc >= 0 ? `-${dc}` : `+${Math.abs(dc)}`) : "0");
    diffFatEl.textContent     = (targets.fat ? (df >= 0 ? `-${df}` : `+${Math.abs(df)}`) : "0");

    if (targets.protein || targets.carbs || targets.fat) {
      totalsHintEl.textContent = "Diff = target − total";
    } else {
      totalsHintEl.textContent = "";
    }
  }

  function renderList() {
    listEl.innerHTML = "";

    if (ingredients.length === 0) {
      listEl.innerHTML = `<div class="text-xs text-gray-400">No ingredients yet.</div>`;
      return;
    }

    ingredients.forEach((item, idx) => {
      const row = document.createElement("div");
      row.className = "border border-white p-2 rounded-lg flex items-center justify-between gap-2";

      const left = document.createElement("div");
      left.className = "flex-1 min-w-0";

      const title = document.createElement("div");
      title.className = "text-sm truncate";
      title.textContent = `${item.name} ×${item.qty}`;

      const meta = document.createElement("div");
      meta.className = "text-xs text-gray-400";
      meta.textContent = `P ${fmt(item.protein)}  C ${fmt(item.carbs)}  F ${fmt(item.fat)} (per serving)`;

      left.appendChild(title);
      left.appendChild(meta);

      const del = document.createElement("button");
      del.className = "border border-white px-2 py-1 rounded-lg text-xs hover:bg-white hover:text-black transition";
      del.textContent = "DEL";
      del.addEventListener("click", () => {
        ingredients.splice(idx, 1);
        localStorage.setItem("ingredients", JSON.stringify(ingredients));
        update();
      });

      row.appendChild(left);
      row.appendChild(del);
      listEl.appendChild(row);
    });
  }

  function update() {
    renderList();
    updateTotalsUI();
  }

  // ----------------------------
  // Targets
  // ----------------------------
  function loadTargetsUI() {
    targetProteinInput.value = targets.protein || "";
    targetCarbsInput.value   = targets.carbs || "";
    targetFatInput.value     = targets.fat || "";
  }

  saveTargetsBtn.addEventListener("click", () => {
    targets = {
      protein: Number(targetProteinInput.value) || 0,
      carbs: Number(targetCarbsInput.value) || 0,
      fat: Number(targetFatInput.value) || 0,
    };
    localStorage.setItem("targets", JSON.stringify(targets));
    update();
  });

  // ----------------------------
  // Meals
  // ----------------------------
  function populateMealDropdown() {
    mealSelect.innerHTML = "";

    const keys = Object.keys(meals).sort((a, b) => a.localeCompare(b));
    if (keys.length === 0) {
      const opt = document.createElement("option");
      opt.value = "";
      opt.textContent = "No saved meals";
      mealSelect.appendChild(opt);
      return;
    }

    keys.forEach((k) => {
      const opt = document.createElement("option");
      opt.value = k;
      opt.textContent = k;
      mealSelect.appendChild(opt);
    });
  }

  saveMealBtn.addEventListener("click", () => {
    const name = mealNameInput.value.trim();
    if (!name) return alert("Enter a meal name.");

    meals[name] = JSON.parse(JSON.stringify(ingredients));
    localStorage.setItem("meals", JSON.stringify(meals));
    populateMealDropdown();
    mealSelect.value = name;
    mealNameInput.value = "";
    alert("Meal saved.");
  });

  loadMealBtn.addEventListener("click", () => {
    const key = mealSelect.value;
    if (!key || !meals[key]) return;

    ingredients = JSON.parse(JSON.stringify(meals[key]));
    localStorage.setItem("ingredients", JSON.stringify(ingredients));
    update();
  });

  deleteMealBtn.addEventListener("click", () => {
    const key = mealSelect.value;
    if (!key || !meals[key]) return;

    if (!confirm(`Delete meal "${key}"?`)) return;
    delete meals[key];
    localStorage.setItem("meals", JSON.stringify(meals));
    populateMealDropdown();
  });

  // ----------------------------
  // Add ingredient
  // ----------------------------
  function clearInputs() {
    nameInput.value = "";
    proteinInput.value = "";
    carbsInput.value = "";
    fatInput.value = "";
    qtyInput.value = 1;
  }

  addBtn.addEventListener("click", () => {
    const name = nameInput.value.trim();
    if (!name) return alert("Ingredient name required.");

    const protein = Number(proteinInput.value) || 0;
    const carbs = Number(carbsInput.value) || 0;
    const fat = Number(fatInput.value) || 0;
    const qty = Number(qtyInput.value) || 1;

    ingredients.push({ name, protein, carbs, fat, qty });
    localStorage.setItem("ingredients", JSON.stringify(ingredients));

    clearInputs();
    update();
  });

  // ----------------------------
  // Simple Autocomplete (local)
  // ----------------------------
  function showResults(items) {
    resultsEl.innerHTML = "";
    if (!items.length) {
      resultsEl.classList.add("hidden");
      return;
    }

    items.forEach((item) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "w-full text-left p-2 border-b border-white hover:bg-white hover:text-black transition text-sm";
      btn.textContent = item.name;
      btn.addEventListener("click", () => {
        nameInput.value = item.name;
        proteinInput.value = item.protein;
        carbsInput.value = item.carbs;
        fatInput.value = item.fat;
        qtyInput.value = 1;
        resultsEl.classList.add("hidden");
      });
      resultsEl.appendChild(btn);
    });

    resultsEl.classList.remove("hidden");
  }

  function ingredientLibrary() {
    // Uses your saved meals as a lightweight library of ingredients.
    // You can expand this later with API search.
    const lib = [];
    Object.values(meals).forEach((arr) => {
      arr.forEach((i) => {
        if (!lib.find(x => x.name.toLowerCase() === i.name.toLowerCase())) {
          lib.push({ name: i.name, protein: i.protein, carbs: i.carbs, fat: i.fat });
        }
      });
    });
    return lib;
  }

  nameInput.addEventListener("input", () => {
    const q = nameInput.value.trim().toLowerCase();
    if (!q) {
      resultsEl.classList.add("hidden");
      return;
    }

    const lib = ingredientLibrary();
    const hits = lib.filter(i => i.name.toLowerCase().includes(q)).slice(0, 8);
    showResults(hits);
  });

  document.addEventListener("click", (e) => {
    if (!resultsEl.contains(e.target) && e.target !== nameInput) {
      resultsEl.classList.add("hidden");
    }
  });

  // ----------------------------
  // Clear / Reset
  // ----------------------------
  clearBtn.addEventListener("click", () => {
    if (!confirm("Clear all ingredients?")) return;
    ingredients = [];
    localStorage.setItem("ingredients", JSON.stringify(ingredients));
    update();
  });

  resetBtn.addEventListener("click", () => {
    if (!confirm("Reset all current data (ingredients and targets)? Saved meals will remain.")) return;

    ingredients = [];
    targets = { protein: 0, carbs: 0, fat: 0 };

    targetProteinInput.value = "";
    targetCarbsInput.value = "";
    targetFatInput.value = "";

    localStorage.setItem("ingredients", JSON.stringify(ingredients));
    localStorage.setItem("targets", JSON.stringify(targets));

    update();
  });


  // ----------------------------
  // Scanner (Barcode + OCR)
  // ----------------------------
  const scanBtn = document.getElementById("scanBtn");
  const scanModal = document.getElementById("scanModal");
  const scanClose = document.getElementById("scanClose");
  const scanVideo = document.getElementById("scanVideo");
  const scanAction = document.getElementById("scanAction");
  const scanUploadBtn = document.getElementById("scanUploadBtn");
  const scanPhotoInput = document.getElementById("scanPhotoInput");
  const scanStatus = document.getElementById("scanStatus");
  const scanCanvas = document.getElementById("scanCanvas");
  const tabBarcode = document.getElementById("tabBarcode");
  const tabLabel = document.getElementById("tabLabel");

  let scanStream = null;
  let mode = "barcode"; // "barcode" | "ocr"
  let zxingReader = null;
  let barcodeActive = false;
  let ocrBusy = false;

  function setScanStatus(msg) { if (scanStatus) scanStatus.textContent = msg; }

  async function startScanCamera() {
    if (scanStream) return;
    try {
      scanStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } },
        audio: false
      });
      scanVideo.srcObject = scanStream;
      await scanVideo.play();
    } catch (e) {
      console.error(e);
      setScanStatus("Camera blocked. Switch to LABEL (OCR) and use UPLOAD.");
    }
  }

  function stopScanCamera() {
    if (!scanStream) return;
    scanStream.getTracks().forEach(t => t.stop());
    scanStream = null;
    if (scanVideo) scanVideo.srcObject = null;
  }

  function openScanModal() {
    if (!scanModal) return;
    scanModal.classList.remove("hidden");
    setScanMode("barcode");
    startScanCamera();
  }

  function closeScanModal() {
    if (!scanModal) return;
    scanModal.classList.add("hidden");
    stopBarcodeScan();
    stopScanCamera();
    setScanStatus("Closed.");
  }

  function setScanMode(next) {
    mode = next;

    if (mode === "barcode") {
      scanUploadBtn?.classList.add("hidden");
      if (scanAction) scanAction.textContent = "START BARCODE SCAN";
      setScanStatus("Barcode mode: point at UPC/EAN and hold steady.");
    } else {
      stopBarcodeScan();
      scanUploadBtn?.classList.remove("hidden");
      if (scanAction) scanAction.textContent = "CAPTURE (OCR)";
      setScanStatus("OCR mode: fill label in frame, then CAPTURE or UPLOAD.");
    }
  }

  // ---- Open Food Facts (barcode -> product -> macros)
  async function fetchMacrosFromBarcode(code) {
    const url = `https://world.openfoodfacts.org/api/v0/product/${encodeURIComponent(code)}.json`;
    const res = await fetch(url);
    const data = await res.json();

    if (!data || data.status !== 1 || !data.product) return { ok: false };

    const p = data.product;
    const n = p.nutriments || {};
    const per = (p.nutrition_data_per === "serving") ? "serving" : "100g";

    const protein = (per === "serving" && n.proteins_serving != null) ? n.proteins_serving : n.proteins_100g;
    const carbs   = (per === "serving" && n.carbohydrates_serving != null) ? n.carbohydrates_serving : n.carbohydrates_100g;
    const fat     = (per === "serving" && n.fat_serving != null) ? n.fat_serving : n.fat_100g;

    return {
      ok: true,
      name: p.product_name || p.generic_name || "",
      per,
      servingSize: p.serving_size || "",
      protein,
      carbs,
      fat
    };
  }

  // ---- Barcode scanning via ZXing
  async function startBarcodeScan() {
    if (barcodeActive) return;
    barcodeActive = true;

    await startScanCamera();

    try {
      if (!zxingReader) {
        // UMD bundle exposes ZXingBrowser global
        zxingReader = new ZXingBrowser.BrowserMultiFormatReader();
      }

      setScanStatus("Scanning… hold steady on the barcode.");

      zxingReader.decodeFromVideoElementContinuously(scanVideo, async (result) => {
        if (!barcodeActive) return;
        if (!result) return;

        const code = result.getText();
        barcodeActive = false;

        setScanStatus(`Found: ${code}. Looking up…`);
        stopBarcodeScan();

        try {
          const r = await fetchMacrosFromBarcode(code);
          if (!r.ok) {
            setScanStatus("Barcode not found. Switch to LABEL (OCR).");
            return;
          }

          if (r.name) nameInput.value = r.name;

          if (r.protein != null) proteinInput.value = Math.round(Number(r.protein));
          if (r.carbs != null) carbsInput.value = Math.round(Number(r.carbs));
          if (r.fat != null) fatInput.value = Math.round(Number(r.fat));

          const extra = (r.per === "serving" && r.servingSize) ? ` (per serving: ${r.servingSize})` : " (per 100g)";
          setScanStatus(`Filled macros from Open Food Facts${extra}.`);
        } catch (e) {
          console.error(e);
          setScanStatus("Lookup failed. Try again or use LABEL (OCR).");
        }
      });
    } catch (e) {
      console.error(e);
      setScanStatus("Barcode scan failed. Use LABEL (OCR).");
      barcodeActive = false;
    }
  }

  function stopBarcodeScan() {
    barcodeActive = false;
    try { zxingReader?.reset(); } catch {}
  }

  // ---- OCR (label -> macros)
  function drawVideoToCanvas() {
    const w = scanVideo.videoWidth || 1280;
    const h = scanVideo.videoHeight || 720;
    scanCanvas.width = w;
    scanCanvas.height = h;
    scanCanvas.getContext("2d").drawImage(scanVideo, 0, 0, w, h);
  }

  function matchGram(text, regex) {
    const m = text.match(regex);
    if (!m) return null;
    for (let i = 1; i < m.length; i++) {
      const v = parseFloat(m[i]);
      if (!Number.isNaN(v)) return v;
    }
    return null;
  }

  function extractMacrosFromText(raw) {
    const t = (raw || "")
      .replace(/\u00A0/g, " ")
      .replace(/[|]/g, " ")
      .replace(/\s+/g, " ")
      .toLowerCase();

    const protein =
      matchGram(t, /(protein)\s*([0-9]+(?:\.[0-9]+)?)\s*g/) ??
      matchGram(t, /([0-9]+(?:\.[0-9]+)?)\s*g\s*(protein)/);

    const fat =
      matchGram(t, /(total fat|fat)\s*([0-9]+(?:\.[0-9]+)?)\s*g/) ??
      matchGram(t, /([0-9]+(?:\.[0-9]+)?)\s*g\s*(total fat|fat)/);

    const carbs =
      matchGram(t, /(total carbohydrate|total carbs|carbohydrate|carbs)\s*([0-9]+(?:\.[0-9]+)?)\s*g/) ??
      matchGram(t, /([0-9]+(?:\.[0-9]+)?)\s*g\s*(total carbohydrate|carbohydrate|carbs)/);

    return { protein, carbs, fat };
  }

  async function runOCR() {
    if (ocrBusy) return;
    ocrBusy = true;

    try {
      setScanStatus("OCR reading…");
      const worker = await Tesseract.createWorker("eng");
      const { data } = await worker.recognize(scanCanvas);
      await worker.terminate();

      const macros = extractMacrosFromText(data?.text || "");

      if (macros.protein != null) proteinInput.value = Math.round(macros.protein);
      if (macros.carbs != null) carbsInput.value = Math.round(macros.carbs);
      if (macros.fat != null) fatInput.value = Math.round(macros.fat);

      if (macros.protein == null && macros.carbs == null && macros.fat == null) {
        setScanStatus("Couldn’t detect macros. Try closer/brighter, or UPLOAD a clearer photo.");
        return;
      }

      setScanStatus("Filled macros from OCR ✓");
    } catch (e) {
      console.error(e);
      setScanStatus("OCR failed. Try UPLOAD or re-capture.");
    } finally {
      ocrBusy = false;
    }
  }

  async function loadImageFileToCanvas(file) {
    const img = new Image();
    const url = URL.createObjectURL(file);
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });

    scanCanvas.width = img.naturalWidth;
    scanCanvas.height = img.naturalHeight;
    scanCanvas.getContext("2d").drawImage(img, 0, 0);

    URL.revokeObjectURL(url);
  }

  // ---- UI wiring
  scanBtn?.addEventListener("click", openScanModal);
  scanClose?.addEventListener("click", closeScanModal);

  tabBarcode?.addEventListener("click", () => setScanMode("barcode"));
  tabLabel?.addEventListener("click", () => setScanMode("ocr"));

  scanAction?.addEventListener("click", async () => {
    if (mode === "barcode") {
      await startBarcodeScan();
    } else {
      await startScanCamera();
      drawVideoToCanvas();
      stopScanCamera(); // frees camera during OCR (helps iOS)
      await runOCR();
    }
  });

  scanUploadBtn?.addEventListener("click", () => scanPhotoInput?.click());

  scanPhotoInput?.addEventListener("change", async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;

    try {
      setScanStatus("Loading photo…");
      await loadImageFileToCanvas(file);
      await runOCR();
    } catch (err) {
      console.error(err);
      setScanStatus("Upload failed. Try a clearer image.");
    } finally {
      scanPhotoInput.value = "";
    }
  });

  // Init
  loadTargetsUI();
  update();
  populateMealDropdown();
</script>

<script>
  // PWA: register service worker (KEEP ONLY ONCE — was duplicated before)
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(console.error);
    });
  }
</script>

</body>
