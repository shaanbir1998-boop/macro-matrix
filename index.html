<script>
let ingredients = [];
let macroTargets = { protein: 0, carbs: 0, fat: 0 };

document.addEventListener("DOMContentLoaded", () => {
  loadFromLocalStorage();
  if (document.getElementById("ingredientList")) renderIngredients();
  if (document.getElementById("totalProtein")) updateTotals();
});

function addIngredient() {
  const nameEl = document.getElementById("name");
  const quantityEl = document.getElementById("quantity");
  const proteinEl = document.getElementById("protein");
  const carbsEl = document.getElementById("carbs");
  const fatEl = document.getElementById("fat");

  if (!nameEl) return;

  const name = nameEl.value.trim();
  const quantity = quantityEl ? parseFloat(quantityEl.value) || 1 : 1;
  const proteinPerUnit = proteinEl ? parseFloat(proteinEl.value) || 0 : 0;
  const carbsPerUnit = carbsEl ? parseFloat(carbsEl.value) || 0 : 0;
  const fatPerUnit = fatEl ? parseFloat(fatEl.value) || 0 : 0;

  if (!name) return;

  ingredients.push({
    id: Date.now(),
    name,
    quantity,
    proteinPerUnit,
    carbsPerUnit,
    fatPerUnit
  });

  saveToLocalStorage();
  renderIngredients();
  updateTotals();
  clearInputs();
}

function deleteIngredient(id) {
  ingredients = ingredients.filter(item => item.id !== id);
  saveToLocalStorage();
  renderIngredients();
  updateTotals();
}

function updateTotals() {
  let totalProtein = 0;
  let totalCarbs = 0;
  let totalFat = 0;

  ingredients.forEach(item => {
    totalProtein += item.proteinPerUnit * item.quantity;
    totalCarbs += item.carbsPerUnit * item.quantity;
    totalFat += item.fatPerUnit * item.quantity;
  });

  const proteinEl = document.getElementById("totalProtein");
  const carbsEl = document.getElementById("totalCarbs");
  const fatEl = document.getElementById("totalFat");

  if (proteinEl) proteinEl.textContent = totalProtein.toFixed(1);
  if (carbsEl) carbsEl.textContent = totalCarbs.toFixed(1);
  if (fatEl) fatEl.textContent = totalFat.toFixed(1);

  updateProgressBars(totalProtein, totalCarbs, totalFat);
}

function updateProgressBars(p, c, f) {
  const proteinBar = document.getElementById("proteinBar");
  const carbsBar = document.getElementById("carbsBar");
  const fatBar = document.getElementById("fatBar");

  if (!proteinBar || !carbsBar || !fatBar) return;

  const proteinPercent = macroTargets.protein ? (p / macroTargets.protein) * 100 : 0;
  const carbsPercent = macroTargets.carbs ? (c / macroTargets.carbs) * 100 : 0;
  const fatPercent = macroTargets.fat ? (f / macroTargets.fat) * 100 : 0;

  proteinBar.style.width = Math.min(proteinPercent, 100) + "%";
  carbsBar.style.width = Math.min(carbsPercent, 100) + "%";
  fatBar.style.width = Math.min(fatPercent, 100) + "%";
}

function setTargets() {
  const proteinEl = document.getElementById("targetProtein");
  const carbsEl = document.getElementById("targetCarbs");
  const fatEl = document.getElementById("targetFat");

  macroTargets.protein = proteinEl ? parseFloat(proteinEl.value) || 0 : 0;
  macroTargets.carbs = carbsEl ? parseFloat(carbsEl.value) || 0 : 0;
  macroTargets.fat = fatEl ? parseFloat(fatEl.value) || 0 : 0;

  saveToLocalStorage();
  updateTotals();
}

function renderIngredients() {
  const list = document.getElementById("ingredientList");
  if (!list) return;

  list.innerHTML = "";

  ingredients.forEach(item => {
    const totalP = item.proteinPerUnit * item.quantity;
    const totalC = item.carbsPerUnit * item.quantity;
    const totalF = item.fatPerUnit * item.quantity;

    const div = document.createElement("div");
    div.className = "border border-white p-2 flex justify-between";

    div.innerHTML = `
      <div>
        ${item.name} (x${item.quantity})
        <div class="text-sm text-gray-400">
          P: ${totalP.toFixed(1)} |
          C: ${totalC.toFixed(1)} |
          F: ${totalF.toFixed(1)}
        </div>
      </div>
      <button onclick="deleteIngredient(${item.id})"
        class="border border-white px-2">
        X
      </button>
    `;

    list.appendChild(div);
  });
}

function saveToLocalStorage() {
  localStorage.setItem("macroMatrixIngredients", JSON.stringify(ingredients));
  localStorage.setItem("macroMatrixTargets", JSON.stringify(macroTargets));
}

function loadFromLocalStorage() {
  const storedIngredients = localStorage.getItem("macroMatrixIngredients");
  const storedTargets = localStorage.getItem("macroMatrixTargets");

  if (storedIngredients) ingredients = JSON.parse(storedIngredients);
  if (storedTargets) macroTargets = JSON.parse(storedTargets);
}

function clearInputs() {
  const nameEl = document.getElementById("name");
  const quantityEl = document.getElementById("quantity");
  const proteinEl = document.getElementById("protein");
  const carbsEl = document.getElementById("carbs");
  const fatEl = document.getElementById("fat");

  if (nameEl) nameEl.value = "";
  if (quantityEl) quantityEl.value = 1;
  if (proteinEl) proteinEl.value = "";
  if (carbsEl) carbsEl.value = "";
  if (fatEl) fatEl.value = "";
}
</script>
