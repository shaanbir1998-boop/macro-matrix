<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"> 
  <meta name="apple-mobile-web-app-capable" content="yes"> 
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Macro Matrix Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen font-mono p-4">
  <div class="max-w-md mx-auto border border-white p-4 min-h-screen">
    <h1 class="text-xl tracking-widest mb-1">MACRO MATRIX CALCULATOR</h1>
    <p class="text-gray-400 text-sm mb-4">Ingredient vectors, summed against daily targets.</p>

    <!-- Targets -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 mb-4">
      <input id="targetProtein" type="number" placeholder="TARGET PROTEIN" class="p-2 bg-black border border-white" />
      <input id="targetCarbs" type="number" placeholder="TARGET CARBS" class="p-2 bg-black border border-white" />
      <input id="targetFat" type="number" placeholder="TARGET FAT" class="p-2 bg-black border border-white" />
    </div>

    <!-- Input Row -->
    <div class="grid grid-cols-1 gap-2 mb-3">
      <input id="name" placeholder="INGREDIENT" class="p-2 bg-black border border-white" />
      <div id="results" class="border border-white hidden max-h-40 overflow-y-auto"></div>
      <input id="protein" type="number" placeholder="PROTEIN (per unit)" class="p-2 bg-black border border-white" />
      <input id="carbs" type="number" placeholder="CARBS (per unit)" class="p-2 bg-black border border-white" />
      <input id="fat" type="number" placeholder="FAT (per unit)" class="p-2 bg-black border border-white" />
      <input id="quantity" type="number" value="1" min="1" placeholder="QTY" class="p-2 bg-black border border-white" />
      <button id="addBtn" class="border border-white hover:bg-white hover:text-black transition py-3 text-lg">ADD</button>
    </div>

    <!-- Save Meal -->
<div class="flex gap-2 mb-3">
  <input id="mealName"
         placeholder="MEAL NAME"
         class="p-2 bg-black border border-white flex-1" />

  <button id="saveMealBtn"
          class="border border-white hover:bg-white hover:text-black transition px-4 py-3 text-lg">
    SAVE MEAL
  </button>
</div>

    <!-- Load Meal -->
<div class="flex gap-2 mb-3">
  <select id="mealSelect"
          class="p-2 bg-black border border-white flex-1">
    <option value="">LOAD MEAL</option>
  </select>

  <button id="loadMealBtn"
          class="border border-white hover:bg-white hover:text-black transition px-4 py-3 text-lg"
    LOAD
  </button>

  <button id="deleteMealBtn"
          class="border border-white hover:bg-white hover:text-black transition px-4 py-3 text-lg"
    DELETE
  </button>
</div>

    <!-- Matrix Table -->
    <div class="overflow-x-auto mb-4">
      <table class="w-full border border-white border-collapse text-xs">
        <thead>
          <tr>
            <th class="border border-white p-2">INGREDIENT</th>
            <th class="border border-white p-2">QTY</th>
            <th class="border border-white p-2">P</th>
            <th class="border border-white p-2">C</th>
            <th class="border border-white p-2">F</th>
            <th class="border border-white p-2">EDIT</th>
          </tr>
        </thead>
        <tbody id="table"></tbody>
      </table>
    </div>

    <!-- Totals + Progress -->
    <div class="grid grid-cols-1 gap-3 sticky bottom-0 bg-black pb-safe">
      <div class="border border-white p-3">
        <div class="text-xs text-gray-400">Σ PROTEIN</div>
        <div id="totalProtein" class="text-2xl font-semibold">0</div>
        <div class="w-full bg-gray-800 h-1 mt-2"><div id="proteinBar" class="bg-blue-400 h-1 w-0 transition-all duration-300"></div></div>
      </div>
      <div class="border border-white p-3">
        <div class="text-xs text-gray-400">Σ CARBS</div>
        <div id="totalCarbs" class="text-2xl font-semibold">0</div>
        <div class="w-full bg-gray-800 h-1 mt-2"><div id="carbsBar" class="bg-amber-400 h-1 w-0 transition-all duration-300"></div></div>
      </div>
      <div class="border border-white p-3">
        <div class="text-xs text-gray-400">Σ FAT</div>
        <div id="totalFat" class="text-2xl font-semibold">0</div>
        <div class="w-full bg-gray-800 h-1 mt-2"><div id="fatBar" class="bg-purple-400 h-1 w-0 transition-all duration-300"></div></div>
      </div>
    </div>
    <!-- Calories (NEW) -->
  <div class="border border-white p-3">
    <div class="text-xs text-gray-400">Σ CALORIES</div>
    <div id="totalCalories" class="text-2xl font-semibold">0</div>
  </div>

</div>
    <div class="text-xs text-gray-500 mt-6 text-center border-t border-white pt-3">
      © 2026 Shaan Bir — Macro Matrix — MIT License
    </div>
  </div>

<script>
let ingredients = JSON.parse(localStorage.getItem('ingredients')) || [];
let meals = JSON.parse(localStorage.getItem('meals')) || [];
let targets = JSON.parse(localStorage.getItem('targets')) || { protein: 0, carbs: 0, fat: 0 };

const nameInput = document.getElementById('name');
const proteinInput = document.getElementById('protein');
const carbsInput = document.getElementById('carbs');
const fatInput = document.getElementById('fat');
  const resultsBox = document.getElementById("results");

nameInput.addEventListener("input", async () => {
  const query = nameInput.value.trim();

  if (query.length < 3) {
    resultsBox.classList.add("hidden");
    return;
  }

  const response = await fetch("/api/search", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ query })
  });

  const data = await response.json();

  resultsBox.innerHTML = "";
  resultsBox.classList.remove("hidden");

  data.foods.slice(0,5).forEach(food => {
    const div = document.createElement("div");

    div.className =
      "p-2 border-b border-white cursor-pointer hover:bg-white hover:text-black";

    div.textContent = food.description;

    div.onclick = () => selectFood(food.fdcId);

    resultsBox.appendChild(div);
  });
});
const quantityInput = document.getElementById('quantity');
const addBtn = document.getElementById('addBtn');
const saveMealBtn = document.getElementById('saveMealBtn');
const mealNameInput = document.getElementById('mealName');
const mealSelect = document.getElementById('mealSelect');
const loadMealBtn = document.getElementById('loadMealBtn');
const deleteMealBtn = document.getElementById('deleteMealBtn');

const targetProteinInput = document.getElementById('targetProtein');
const targetCarbsInput = document.getElementById('targetCarbs');
const targetFatInput = document.getElementById('targetFat');

const tableBody = document.getElementById('table');

targetProteinInput.value = targets.protein;
targetCarbsInput.value = targets.carbs;
targetFatInput.value = targets.fat;

addBtn.addEventListener('click', addIngredient);
saveMealBtn.addEventListener('click', saveMeal);
loadMealBtn.addEventListener('click', loadMeal);
deleteMealBtn.addEventListener('click', deleteMeal);

function saveAll() {
  localStorage.setItem('ingredients', JSON.stringify(ingredients));
  localStorage.setItem('targets', JSON.stringify(targets));
}

function addIngredient() {
  if (!nameInput.value.trim()) return;

  ingredients.push({
    name: nameInput.value.toUpperCase(),
    quantity: Number(quantityInput.value) || 1,
    protein: Number(proteinInput.value) || 0,
    carbs: Number(carbsInput.value) || 0,
    fat: Number(fatInput.value) || 0
  });

  nameInput.value = '';
  proteinInput.value = '';
  carbsInput.value = '';
  fatInput.value = '';
  quantityInput.value = 1;

  update();
}

function saveMeal() {

  const mealName = mealNameInput.value.trim();

  if (!mealName) {
    alert("Enter meal name");
    return;
  }

  if (ingredients.length === 0) {
    alert("No ingredients to save");
    return;
  }

  const meal = {
    name: mealName.toUpperCase(),
    ingredients: [...ingredients],
    date: new Date().toISOString()
  };

  meals.push(meal);

  localStorage.setItem("meals", JSON.stringify(meals));

  populateMealDropdown();

  alert("Meal saved");

  mealNameInput.value = "";
}

  function populateMealDropdown() {

  mealSelect.innerHTML = '<option value="">LOAD MEAL</option>';

  meals.forEach((meal, index) => {

    const option = document.createElement("option");

    option.value = index;

    option.textContent =
      meal.name + " (" +
      new Date(meal.date).toLocaleDateString() +
      ")";

    mealSelect.appendChild(option);

  });

}

function loadMeal() {

  const index = mealSelect.value;

  if (index === "") return;

  ingredients = [...meals[index].ingredients];

  update();

}

function deleteMeal() {

  const index = mealSelect.value;

  if (index === "") return;

  if (!confirm("Delete this meal?")) return;

  meals.splice(index, 1);

  localStorage.setItem("meals", JSON.stringify(meals));

  populateMealDropdown();

}
  
function removeIngredient(index) {
  ingredients.splice(index, 1);
  update();
}

function editIngredient(index) {
  const i = ingredients[index];
  nameInput.value = i.name;
  proteinInput.value = i.protein;
  carbsInput.value = i.carbs;
  fatInput.value = i.fat;
  quantityInput.value = i.quantity;
  ingredients.splice(index, 1);
  update();
}

function renderTable() {
  tableBody.innerHTML = '';
  ingredients.forEach((i, idx) => {
    const totalP = i.protein * i.quantity;
    const totalC = i.carbs * i.quantity;
    const totalF = i.fat * i.quantity;

    const row = document.createElement('tr');
    row.innerHTML = `
      <td class="border border-white p-2">${i.name}</td>
      <td class="border border-white p-2 text-center">${i.quantity}</td>
      <td class="border border-white p-2 text-center">${totalP}</td>
      <td class="border border-white p-2 text-center">${totalC}</td>
      <td class="border border-white p-2 text-center">${totalF}</td>
      <td class="border border-white p-2 text-center">
        <button class="px-3 py-1" onclick="editIngredient(${idx})">EDIT</button> |
        <button onclick="removeIngredient(${idx})">X</button>
      </td>
    `;
    tableBody.appendChild(row);
  });
}

function calculateTotals() {
  const totals = ingredients.reduce((a, i) => {
    a.protein += i.protein * i.quantity;
    a.carbs += i.carbs * i.quantity;
    a.fat += i.fat * i.quantity;
    return a;
  }, { protein: 0, carbs: 0, fat: 0 });

   // ADD THIS LINE
  const calories = (totals.protein * 4) + (totals.carbs * 4) + (totals.fat * 9);

  targets.protein = Number(targetProteinInput.value) || 0;
  targets.carbs = Number(targetCarbsInput.value) || 0;
  targets.fat = Number(targetFatInput.value) || 0;

  document.getElementById('totalProtein').textContent = totals.protein;
  document.getElementById('totalCarbs').textContent = totals.carbs;
  document.getElementById('totalFat').textContent = totals.fat;

    // ADD THIS LINE
  document.getElementById('totalCalories').textContent = calories.toFixed(0);

  document.getElementById('proteinBar').style.width =
    targets.protein ? Math.min(100, totals.protein / targets.protein * 100) + '%' : '0%';

  document.getElementById('carbsBar').style.width =
    targets.carbs ? Math.min(100, totals.carbs / targets.carbs * 100) + '%' : '0%';

  document.getElementById('fatBar').style.width =
    targets.fat ? Math.min(100, totals.fat / targets.fat * 100) + '%' : '0%';
  
const proteinPercent = targets.protein ? totals.protein / targets.protein : 0;
const carbsPercent = targets.carbs ? totals.carbs / targets.carbs : 0;
const fatPercent = targets.fat ? totals.fat / targets.fat : 0;

setBarColor("proteinBar", proteinPercent, "blue");
setBarColor("carbsBar", carbsPercent, "amber");
setBarColor("fatBar", fatPercent, "purple");
}

function update() {
  renderTable();
  calculateTotals();
  saveAll();
}

  // ADD THIS FUNCTION RIGHT HERE
function setBarColor(id, percent, color) {

  const bar = document.getElementById(id);

  bar.classList.remove(
    "bg-blue-400","bg-amber-400","bg-purple-400",
    "bg-green-400","bg-red-400"
  );

  if (percent > 1.1) {
    bar.classList.add("bg-red-400");
  }
  else if (percent >= 0.95) {
    bar.classList.add("bg-green-400");
  }
  else {
    bar.classList.add(`bg-${color}-400`);
  }

}

update();
  populateMealDropdown();
  
async function selectFood(fdcId) {
  const response = await fetch(`/api/food?id=${fdcId}`);
  const data = await response.json();

  if (data.error) {
    alert(data.error);
    return;
  }

  proteinInput.value = data.protein ?? 0;
  carbsInput.value = data.carbs ?? 0;
  fatInput.value = data.fats ?? 0;
  nameInput.value = (data.name ?? "").toUpperCase();

  // Optional: show what "1 item" means
  // e.g., "1 sandwich" or "1 medium"
  // console.log("Serving:", data.servingLabel, "(", data.grams, "g )");

  resultsBox.classList.add("hidden");
}
  
</script>
</body>
</html>
