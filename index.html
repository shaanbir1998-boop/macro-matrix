<script>
/*
  Macro Matrix
  Quantity-enabled version
*/

let ingredients = [];
let macroTargets = {
  protein: 0,
  carbs: 0,
  fat: 0
};

/* =========================
   LOAD ON START
========================= */

document.addEventListener("DOMContentLoaded", () => {
  loadFromLocalStorage();
  renderIngredients();
  updateTotals();
});

/* =========================
   ADD INGREDIENT
========================= */

function addIngredient() {
  const name = document.getElementById("name").value.trim();
  const quantity = parseFloat(document.getElementById("quantity").value) || 1;
  const proteinPerUnit = parseFloat(document.getElementById("protein").value) || 0;
  const carbsPerUnit = parseFloat(document.getElementById("carbs").value) || 0;
  const fatPerUnit = parseFloat(document.getElementById("fat").value) || 0;

  if (!name) return;

  ingredients.push({
    id: Date.now(),
    name,
    quantity,
    proteinPerUnit,
    carbsPerUnit,
    fatPerUnit
  });

  saveToLocalStorage();
  renderIngredients();
  updateTotals();
  clearInputs();
}

/* =========================
   DELETE INGREDIENT
========================= */

function deleteIngredient(id) {
  ingredients = ingredients.filter(item => item.id !== id);
  saveToLocalStorage();
  renderIngredients();
  updateTotals();
}

/* =========================
   UPDATE TOTALS
========================= */

function updateTotals() {
  let totalProtein = 0;
  let totalCarbs = 0;
  let totalFat = 0;

  ingredients.forEach(item => {
    totalProtein += item.proteinPerUnit * item.quantity;
    totalCarbs += item.carbsPerUnit * item.quantity;
    totalFat += item.fatPerUnit * item.quantity;
  });

  document.getElementById("totalProtein").textContent = totalProtein.toFixed(1);
  document.getElementById("totalCarbs").textContent = totalCarbs.toFixed(1);
  document.getElementById("totalFat").textContent = totalFat.toFixed(1);

  updateProgressBars(totalProtein, totalCarbs, totalFat);
}

/* =========================
   PROGRESS BARS
========================= */

function updateProgressBars(p, c, f) {
  const proteinPercent = macroTargets.protein
    ? (p / macroTargets.protein) * 100
    : 0;

  const carbsPercent = macroTargets.carbs
    ? (c / macroTargets.carbs) * 100
    : 0;

  const fatPercent = macroTargets.fat
    ? (f / macroTargets.fat) * 100
    : 0;

  document.getElementById("proteinBar").style.width =
    Math.min(proteinPercent, 100) + "%";

  document.getElementById("carbsBar").style.width =
    Math.min(carbsPercent, 100) + "%";

  document.getElementById("fatBar").style.width =
    Math.min(fatPercent, 100) + "%";
}

/* =========================
   SET TARGETS
========================= */

function setTargets() {
  macroTargets.protein =
    parseFloat(document.getElementById("targetProtein").value) || 0;

  macroTargets.carbs =
    parseFloat(document.getElementById("targetCarbs").value) || 0;

  macroTargets.fat =
    parseFloat(document.getElementById("targetFat").value) || 0;

  saveToLocalStorage();
  updateTotals();
}

/* =========================
   RENDER INGREDIENTS
========================= */

function renderIngredients() {
  const list = document.getElementById("ingredientList");
  list.innerHTML = "";

  ingredients.forEach(item => {
    const totalP = item.proteinPerUnit * item.quantity;
    const totalC = item.carbsPerUnit * item.quantity;
    const totalF = item.fatPerUnit * item.quantity;

    const div = document.createElement("div");
    div.className = "border border-white p-2 flex justify-between";

    div.innerHTML = `
      <div>
        ${item.name} (x${item.quantity})
        <div class="text-sm text-gray-400">
          P: ${totalP.toFixed(1)} |
          C: ${totalC.toFixed(1)} |
          F: ${totalF.toFixed(1)}
        </div>
      </div>
      <button onclick="deleteIngredient(${item.id})"
        class="border border-white px-2">
        X
      </button>
    `;

    list.appendChild(div);
  });
}

/* =========================
   LOCAL STORAGE
========================= */

function saveToLocalStorage() {
  localStorage.setItem(
    "macroMatrixIngredients",
    JSON.stringify(ingredients)
  );

  localStorage.setItem(
    "macroMatrixTargets",
    JSON.stringify(macroTargets)
  );
}

function loadFromLocalStorage() {
  const storedIngredients =
    localStorage.getItem("macroMatrixIngredients");

  const storedTargets =
    localStorage.getItem("macroMatrixTargets");

  if (storedIngredients)
    ingredients = JSON.parse(storedIngredients);

  if (storedTargets)
    macroTargets = JSON.parse(storedTargets);
}

/* =========================
   CLEAR INPUTS
========================= */

function clearInputs() {
  document.getElementById("name").value = "";
  document.getElementById("quantity").value = 1;
  document.getElementById("protein").value = "";
  document.getElementById("carbs").value = "";
  document.getElementById("fat").value = "";
}
</script>
