<!DOCTYPE html>
<html>
<head>
  <title>Macro Matrix Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 40px;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
    }

    table {
      margin: auto;
      border-collapse: collapse;
      background: white;
      width: 90%;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    th {
      background-color: #222;
      color: white;
    }

    input {
      width: 70px;
      padding: 5px;
      text-align: center;
    }

    .food-name {
      width: 120px;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    .totals {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>Macro Matrix Calculator</h1>

<table id="macroTable">
  <thead>
    <tr>
      <th>Food</th>
      <th>Protein (g)</th>
      <th>Carbs (g)</th>
      <th>Fats (g)</th>
      <th>Quantity</th>
      <th>Total Protein</th>
      <th>Total Carbs</th>
      <th>Total Fats</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td><input class="food-name" type="text"></td>
      <td><input type="number" value="0" oninput="calculate()"></td>
      <td><input type="number" value="0" oninput="calculate()"></td>
      <td><input type="number" value="0" oninput="calculate()"></td>
      <td><input type="number" value="1" min="1" oninput="calculate()"></td>
      <td class="row-protein">0</td>
      <td class="row-carbs">0</td>
      <td class="row-fats">0</td>
    </tr>
  </tbody>
</table>

<button onclick="addRow()">Add Food</button>

<div class="totals">
  Total Protein: <span id="totalProtein">0</span> g |
  Total Carbs: <span id="totalCarbs">0</span> g |
  Total Fats: <span id="totalFats">0</span> g
</div>

<script>

function calculate() {
  let totalProtein = 0;
  let totalCarbs = 0;
  let totalFats = 0;

  const rows = document.querySelectorAll("#macroTable tbody tr");

  rows.forEach(row => {
    const inputs = row.querySelectorAll("input");
    const protein = parseFloat(inputs[1].value) || 0;
    const carbs = parseFloat(inputs[2].value) || 0;
    const fats = parseFloat(inputs[3].value) || 0;
    const quantity = parseFloat(inputs[4].value) || 0;

    const rowProtein = protein * quantity;
    const rowCarbs = carbs * quantity;
    const rowFats = fats * quantity;

    row.querySelector(".row-protein").innerText = rowProtein;
    row.querySelector(".row-carbs").innerText = rowCarbs;
    row.querySelector(".row-fats").innerText = rowFats;

    totalProtein += rowProtein;
    totalCarbs += rowCarbs;
    totalFats += rowFats;
  });

  document.getElementById("totalProtein").innerText = totalProtein;
  document.getElementById("totalCarbs").innerText = totalCarbs;
  document.getElementById("totalFats").innerText = totalFats;
}

function addRow() {
  const table = document.querySelector("#macroTable tbody");

  const newRow = document.createElement("tr");

  newRow.innerHTML = `
    <td><input class="food-name" type="text"></td>
    <td><input type="number" value="0" oninput="calculate()"></td>
    <td><input type="number" value="0" oninput="calculate()"></td>
    <td><input type="number" value="0" oninput="calculate()"></td>
    <td><input type="number" value="1" min="1" oninput="calculate()"></td>
    <td class="row-protein">0</td>
    <td class="row-carbs">0</td>
    <td class="row-fats">0</td>
  `;

  table.appendChild(newRow);
}

</script>

</body>
</html>
