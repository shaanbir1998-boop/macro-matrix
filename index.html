  <style>
    :root{
      --mm-silhouette: #000000;     /* Silhouette 19-4103 TCX */
      --mm-stalactite: #E6E7E8;     /* Stalactite 11-4101 TCX */
      --mm-secret:     #A7B0B8;     /* Secret Spaces 14-4309 TCX */
      --mm-bluebird:   #F27D9B;     /* Mountain Bluebird 16-4039 TCX */
    }

    body{
      background: var(--mm-silhouette) !important;
      color: var(--mm-stalactite) !important;
    }

    .border-white{ border-color: var(--mm-stalactite) !important; }
    .border{ border-color: var(--mm-stalactite) !important; }

    .text-gray-400, .text-gray-500, .text-gray-300{
      color: var(--mm-stalactite) !important;
      opacity: 0.9;
    }

    #mmTitle{ color: var(--mm-secret) !important; }

    select{
      min-width: 0;
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
    }

    input, select{
      background: transparent !important;
      color: var(--mm-stalactite) !important;
      border: 1px solid var(--mm-stalactite) !important;
    }
    input::placeholder{ color: rgba(230,231,232,0.65); }
    input:focus, select:focus{
      outline: none;
      box-shadow: 0 0 0 2px rgba(230,231,232,0.25);
    }

    .mm-btn{
      background: var(--mm-bluebird) !important;
      color: var(--mm-stalactite) !important;
      border-color: var(--mm-bluebird) !important;
      transition: opacity 0.15s ease, transform 0.12s ease;
    }
    .mm-btn:hover{ opacity: 0.88; }
    .mm-btn:active{ transform: translateY(1px); }

    .hover\:bg-white:hover{ background: var(--mm-bluebird) !important; }
    .hover\:text-black:hover{ color: var(--mm-stalactite) !important; }

    a{ color: var(--mm-stalactite) !important; }

.mm-modal-wrap{
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
}
.mm-modal-wrap.show{ display:flex; }

.mm-modal-backdrop{
  position:absolute;
  inset:0;
  background: rgba(0,0,0,0.9);
}

.mm-crt-small{
  position:relative;
  width: 100%;
  max-width: 360px;   /* smaller box */
  background:#0B0B0B;
  border:2px solid #2A2A2A;
  box-shadow: 0 0 0 1px #000 inset, 0 20px 60px rgba(0,0,0,0.7);
  padding:14px;
}

.mm-crt-inner{
  border:1px solid #2A2A2A;
  padding:18px 14px;
  background:#0B0B0B;
  text-align:center;
}

.mm-crt-title{
  color:#EDEDED;
  font-size:16px;
  letter-spacing:0.25em;
  text-transform:uppercase;
  margin-bottom:14px;
}

.mm-crt-input{
  width:100%;
  padding:10px 10px;
  background: transparent !important;
  color:#EDEDED !important;
  border:1px solid #3A3A3A !important;
  border-radius:0 !important;
  font-size:16px;
  letter-spacing:0.25em;

  text-align:center;
  outline:none;
}

.mm-crt-input:focus{
  outline:1px dashed #EDEDED;
  outline-offset:3px;
}

.mm-crt-enter{
  margin-top:14px;
  width:100%;
  padding:9px 12px;
  background:transparent;
  color:#EDEDED;
  border:1px solid #3A3A3A;
  letter-spacing:0.25em;
  text-transform:uppercase;
  font-size:13px;
  cursor:pointer;
}

.mm-crt-enter:active{
  transform:translateY(1px);
}

</style>

  <!-- Scanner Modal (Barcode + Label OCR) -->
  <div id="scanModal" class="fixed inset-0 hidden z-50">
    <div class="absolute inset-0 bg-black/70"></div>

    <div class="relative mx-auto mt-16 w-[92%] max-w-md border border-white p-3 bg-black">
      <div class="flex items-center justify-between mb-2">

<script>
  // ----------------------------
  // State
  // ----------------------------
  let ingredients = JSON.parse(localStorage.getItem('ingredients')) || [];
  let meals = JSON.parse(localStorage.getItem('meals')) || [];
  let targets = JSON.parse(localStorage.getItem('targets')) || { protein: 0, carbs: 0, fat: 0 };

  // ----------------------------
  // Elements
  // ----------------------------
  const nameInput = document.getElementById('name');
  const proteinInput = document.getElementById('protein');
  const carbsInput = document.getElementById('carbs');
  const fatInput = document.getElementById('fat');
  const resultsBox = document.getElementById("results");

  const quantityInput = document.getElementById('quantity');
  const addBtn = document.getElementById('addBtn');
  const saveMealBtn = document.getElementById('saveMealBtn');
  const mealNameInput = document.getElementById('mealName');
  const mealSelect = document.getElementById('mealSelect');
  const loadMealBtn = document.getElementById('loadMealBtn');
  const deleteMealBtn = document.getElementById('deleteMealBtn');

  const targetProteinInput = document.getElementById('targetProtein');
  const targetCarbsInput = document.getElementById('targetCarbs');
  const targetFatInput = document.getElementById('targetFat');

  const tableBody = document.getElementById('table');

  targetProteinInput.value = targets.protein;
  targetCarbsInput.value = targets.carbs;
  targetFatInput.value = targets.fat;

  // ----------------------------
  // Events
  // ----------------------------
  addBtn.addEventListener('click', addIngredient);
  saveMealBtn.addEventListener('click', saveMeal);
  loadMealBtn.addEventListener('click', loadMeal);
  deleteMealBtn.addEventListener('click', deleteMeal);

  // Search food (FIXED: guards + errors so app doesn't "silently die")
  nameInput.addEventListener("input", async () => {
    const query = nameInput.value.trim();

    if (query.length < 3) {
      resultsBox.classList.add("hidden");
      return;
    }

    try {
      const response = await fetch("/api/search", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ query })
      });

      let data = null;
      try { data = await response.json(); } catch { data = null; }

      if (!response.ok || !data || !Array.isArray(data.foods)) {
        resultsBox.innerHTML = `<div class="p-2">No results</div>`;
        resultsBox.classList.remove("hidden");
        return;
      }

      resultsBox.innerHTML = "";
      resultsBox.classList.remove("hidden");

      data.foods.slice(0, 5).forEach(food => {
        const div = document.createElement("div");
        div.className = "p-2 border-b border-white cursor-pointer hover:bg-white hover:text-black";
        div.textContent = food.description;
        div.onclick = () => selectFood(food.fdcId);
        resultsBox.appendChild(div);
      });
    } catch (err) {
      console.error(err);
      resultsBox.innerHTML = `<div class="p-2">Search error</div>`;
      resultsBox.classList.remove("hidden");
    }
  });

  // ----------------------------
  // Persistence
  // ----------------------------
  function saveAll() {
    localStorage.setItem('ingredients', JSON.stringify(ingredients));
    localStorage.setItem('targets', JSON.stringify(targets));
  }

  // ----------------------------
  // Core actions
  // ----------------------------
  function addIngredient() {
    if (!nameInput.value.trim()) return;

    ingredients.push({
      name: nameInput.value.toUpperCase(),
      quantity: Number(quantityInput.value) || 1,
      protein: Number(proteinInput.value) || 0,
      carbs: Number(carbsInput.value) || 0,
      fat: Number(fatInput.value) || 0
    });

    nameInput.value = '';
    proteinInput.value = '';
    carbsInput.value = '';
    fatInput.value = '';
    quantityInput.value = 1;

    resultsBox.classList.add("hidden");
    update();
  }

  function saveMeal() {
    const mealName = mealNameInput.value.trim();
    if (!mealName) { alert("Enter meal name"); return; }
    if (ingredients.length === 0) { alert("No ingredients to save"); return; }

    const meal = {
      name: mealName.toUpperCase(),
      ingredients: [...ingredients],
      date: new Date().toISOString()
    };

    meals.push(meal);
    localStorage.setItem("meals", JSON.stringify(meals));
    populateMealDropdown();
    alert("Meal saved");
    mealNameInput.value = "";
  }

  function populateMealDropdown() {
    mealSelect.innerHTML = '<option value="">LOAD MEAL</option>';

    meals.forEach((meal, index) => {
      const option = document.createElement("option");
      option.value = index;
      option.textContent =
        meal.name + " (" + new Date(meal.date).toLocaleDateString() + ")";
      mealSelect.appendChild(option);
    });
  }

  function loadMeal() {
    const index = mealSelect.value;
    if (index === "") return;

    const y = window.scrollY;
    ingredients = [...meals[index].ingredients];
    update();

    mealSelect.blur();
    requestAnimationFrame(() => window.scrollTo({ top: y }));
  }

  function deleteMeal() {
    const index = mealSelect.value;
    if (index === "") return;
    if (!confirm("Delete this meal?")) return;

    const y = window.scrollY;
    meals.splice(index, 1);
    localStorage.setItem("meals", JSON.stringify(meals));
    populateMealDropdown();

    mealSelect.value = "";
    mealSelect.blur();
    requestAnimationFrame(() => window.scrollTo({ top: y }));
  }

  function removeIngredient(index) {
    ingredients.splice(index, 1);
    update();
  }

  function editIngredient(index) {
    const i = ingredients[index];
    nameInput.value = i.name;
    proteinInput.value = i.protein;
    carbsInput.value = i.carbs;
    fatInput.value = i.fat;
    quantityInput.value = i.quantity;
    ingredients.splice(index, 1);
    update();
  }

  // ----------------------------
  // Rendering + totals
  // ----------------------------
  function renderTable() {
    tableBody.innerHTML = '';
    ingredients.forEach((i, idx) => {
      const totalP = i.protein * i.quantity;
      const totalC = i.carbs * i.quantity;
      const totalF = i.fat * i.quantity;

      const row = document.createElement('tr');
      row.innerHTML = `
        <td class="border border-white p-2">${i.name}</td>
        <td class="border border-white p-2 text-center">${i.quantity}</td>
        <td class="border border-white p-2 text-center">${totalP}</td>
        <td class="border border-white p-2 text-center">${totalC}</td>
        <td class="border border-white p-2 text-center">${totalF}</td>
        <td class="border border-white p-2 text-center">
          <button class="mm-btn border border-white px-3 py-1 rounded-md" onclick="editIngredient(${idx})">E</button>
          <span class="px-1">|</span>
          <button class="mm-btn border border-white px-3 py-1 rounded-md" onclick="removeIngredient(${idx})">X</button>
        </td>
      `;
      tableBody.appendChild(row);
    });
  }

  function calculateTotals() {
    const totals = ingredients.reduce((a, i) => {
      a.protein += i.protein * i.quantity;
      a.carbs += i.carbs * i.quantity;
      a.fat += i.fat * i.quantity;
      return a;
    }, { protein: 0, carbs: 0, fat: 0 });

    const calories = (totals.protein * 4) + (totals.carbs * 4) + (totals.fat * 9);

    targets.protein = Number(targetProteinInput.value) || 0;
    targets.carbs = Number(targetCarbsInput.value) || 0;
    targets.fat = Number(targetFatInput.value) || 0;

    document.getElementById('totalProtein').textContent = totals.protein;
    document.getElementById('totalCarbs').textContent = totals.carbs;
    document.getElementById('totalFat').textContent = totals.fat;
    document.getElementById('totalCalories').textContent = calories.toFixed(0);

    document.getElementById('proteinBar').style.width =
      targets.protein ? Math.min(100, totals.protein / targets.protein * 100) + '%' : '0%';

    document.getElementById('carbsBar').style.width =
      targets.carbs ? Math.min(100, totals.carbs / targets.carbs * 100) + '%' : '0%';

    document.getElementById('fatBar').style.width =
      targets.fat ? Math.min(100, totals.fat / targets.fat * 100) + '%' : '0%';

    const proteinPercent = targets.protein ? totals.protein / targets.protein : 0;
    const carbsPercent = targets.carbs ? totals.carbs / targets.carbs : 0;
    const fatPercent = targets.fat ? totals.fat / targets.fat : 0;

    setBarColor("proteinBar", proteinPercent, "blue");
    setBarColor("carbsBar", carbsPercent, "amber");
    setBarColor("fatBar", fatPercent, "purple");
  }

  function update() {
    renderTable();
    calculateTotals();
    saveAll();
  }

  function setBarColor(id, percent, color) {
    const bar = document.getElementById(id);

    bar.classList.remove(
      "bg-blue-400","bg-amber-400","bg-purple-400",
      "bg-green-400","bg-red-400"
    );

    if (percent > 1.1) bar.classList.add("bg-red-400");
    else if (percent >= 0.95) bar.classList.add("bg-green-400");
    else bar.classList.add(`bg-${color}-400`);
  }

  // ----------------------------
  // Food select (FIXED: supports fat vs fats, better error handling)
  // ----------------------------
  async function selectFood(fdcId) {
    try {
      const response = await fetch(`/api/food?id=${encodeURIComponent(fdcId)}`);
      const data = await response.json();

      if (!response.ok || data?.error) {
        alert(data?.error || "Failed to fetch food details");
        return;
      }

      proteinInput.value = data.protein ?? 0;
      carbsInput.value = data.carbs ?? 0;

      // Robust: some versions return "fat", some "fats"
      const fatVal = (data.fats ?? data.fat ?? 0);
      fatInput.value = fatVal;

      nameInput.value = (data.name ?? "").toUpperCase();
      resultsBox.classList.add("hidden");
    } catch (err) {
      console.error(err);
      alert("Food lookup failed");
    }
  }

  // ----------------------------
  // Reset (keeps saved meals)
  // ----------------------------
  const resetBtn = document.getElementById("resetBtn");
  resetBtn.addEventListener("click", () => {
    if (!confirm("Reset all current data (ingredients and targets)? Saved meals will remain.")) return;

    ingredients = [];
    targets = { protein: 0, carbs: 0, fat: 0 };

    targetProteinInput.value = "";
    targetCarbsInput.value = "";
    targetFatInput.value = "";

    localStorage.setItem("ingredients", JSON.stringify(ingredients));
    localStorage.setItem("targets", JSON.stringify(targets));

    update();
  });



  // ----------------------------
  // Upgrade (force latest version without cache-clearing)
  // ----------------------------
  const upgradeBtn = document.getElementById("upgradeBtn");
  const upgradeStatus = document.getElementById("upgradeStatus");

  function setUpgradeStatus(msg) {
    if (!upgradeStatus) return;
    upgradeStatus.textContent = msg;
    upgradeStatus.classList.remove("hidden");
  }

  function cacheBustReload() {
    const u = new URL(window.location.href);
    u.searchParams.set("v", Date.now().toString());
    window.location.replace(u.toString());
  }

  async function upgradeNow() {
    setUpgradeStatus("Checking for updates…");

    // If no service worker, just force a fresh navigation URL.
    if (!("serviceWorker" in navigator)) {
      setUpgradeStatus("Reloading latest…");
      cacheBustReload();
      return;
    }

    let reg = null;
    try {
      reg = await navigator.serviceWorker.getRegistration();
    } catch {}

    if (!reg) {
      setUpgradeStatus("Reloading latest…");
      cacheBustReload();
      return;
    }

    // Reload once the new SW takes control.
    let reloaded = false;
    const onController = () => {
      if (reloaded) return;
      reloaded = true;
      setUpgradeStatus("Updated ✓ Reloading…");
      cacheBustReload();
    };
    navigator.serviceWorker.addEventListener("controllerchange", onController);

    try { await reg.update(); } catch {}

    // If a new SW is already waiting, activate it now.
    if (reg.waiting) {
      setUpgradeStatus("Applying update…");
      reg.waiting.postMessage({ type: "SKIP_WAITING" });
      return;
    }

    // Otherwise, wait briefly for an update to be found/installed.
    await new Promise((resolve) => {
      let done = false;

      const finish = () => {
        if (done) return;
        done = true;
        resolve(null);
      };

      const timer = setTimeout(finish, 5000);

      reg.addEventListener("updatefound", () => {
        const sw = reg.installing;
        if (!sw) return;
        setUpgradeStatus("Downloading update…");

        sw.addEventListener("statechange", () => {
          if (sw.state === "installed") {
            clearTimeout(timer);
            if (reg.waiting) {
              setUpgradeStatus("Applying update…");
              reg.waiting.postMessage({ type: "SKIP_WAITING" });
            } else {
              finish();
            }
          }
        });
      });

      // If nothing happens quickly, still reload with a cache-busting URL.
      // (Useful for non-PWA browser visitors.)
      // controllerchange handler above will win if SW updates.
      setTimeout(() => {
        if (!reloaded) {
          setUpgradeStatus("Reloading latest…");
          cacheBustReload();
        }
        finish();
      }, 5500);
    });
  }

  upgradeBtn?.addEventListener("click", upgradeNow);




  // ----------------------------
  // Scanner (small add-on)
  // Barcode → Open Food Facts, fallback to OCR
  // ----------------------------
  const scanBtn = document.getElementById("scanBtn");
  const scanModal = document.getElementById("scanModal");
  const scanCloseBtn = document.getElementById("scanCloseBtn");
  const scanTabBarcode = document.getElementById("scanTabBarcode");
  const scanTabOCR = document.getElementById("scanTabOCR");
  const scanVideo = document.getElementById("scanVideo");
  const scanActionBtn = document.getElementById("scanActionBtn");
  const scanUploadBtn = document.getElementById("scanUploadBtn");
  const scanPhotoInput = document.getElementById("scanPhotoInput");
  const scanStatus = document.getElementById("scanStatus");
  const scanCanvas = document.getElementById("scanCanvas");

  let scanStream = null;
  let scanMode = "barcode"; // "barcode" | "ocr"
  let barcodeActive = false;
  let zxingReader = null;
  let ocrBusy = false;

  function setScanStatus(msg) { if (scanStatus) scanStatus.textContent = msg; }

  
  async function tryEnableTorch(stream, on = true) {
    const track = stream?.getVideoTracks?.()[0];
    if (!track) return;

    const caps = track.getCapabilities?.();
    if (!caps?.torch) return;

    try {
      await track.applyConstraints({ advanced: [{ torch: on }] });
    } catch {}
  }

async function startScanCamera() {
    if (scanStream) return;
    try {
      scanStream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1920 },
          height: { ideal: 1080 },
          frameRate: { ideal: 30 }
        },
        audio: false
      });
      scanVideo.srcObject = scanStream;
      await scanVideo.play();
    
      await tryEnableTorch(scanStream, true);
} catch (e) {
      console.error(e);
      setScanStatus("Camera blocked. Use UPLOAD in OCR mode.");
    }
  }

  function stopScanCamera() {
    if (!scanStream) return;
    scanStream.getTracks().forEach(t => t.stop());
    scanStream = null;
    if (scanVideo) scanVideo.srcObject = null;
  }

  function openScanModal() {
    if (!scanModal) return;
    scanModal.classList.remove("hidden");
    setScanMode("barcode");
    startScanCamera();
  }

  function closeScanModal() {
    if (!scanModal) return;
    scanModal.classList.add("hidden");
    stopBarcodeScan();
    stopScanCamera();
  }

  function setScanMode(mode) {
    scanMode = mode;
    stopBarcodeScan();

    if (scanMode === "barcode") {
      scanUploadBtn.classList.add("hidden");
      scanActionBtn.textContent = "START";
      setScanStatus("Barcode mode: point at UPC/EAN.");
    } else {
      scanUploadBtn.classList.remove("hidden");
      scanActionBtn.textContent = "CAPTURE";
      setScanStatus("OCR mode: fill the label, then CAPTURE or UPLOAD.");
    }
  }

  // Open Food Facts lookup: https://world.openfoodfacts.org/api/v0/product/{barcode}.json
  async function fetchMacrosFromBarcode(code) {
    const url = `https://world.openfoodfacts.org/api/v0/product/${encodeURIComponent(code)}.json`;
    const res = await fetch(url);
    const data = await res.json();

    if (!data || data.status !== 1 || !data.product) return { ok: false };

    const p = data.product;
    const n = p.nutriments || {};
    const per = (p.nutrition_data_per === "serving") ? "serving" : "100g";

    const protein = (per === "serving" && n.proteins_serving != null) ? n.proteins_serving : n.proteins_100g;
    const carbs   = (per === "serving" && n.carbohydrates_serving != null) ? n.carbohydrates_serving : n.carbohydrates_100g;
    const fat     = (per === "serving" && n.fat_serving != null) ? n.fat_serving : n.fat_100g;

    return {
      ok: true,
      name: p.product_name || p.generic_name || "",
      per,
      servingSize: p.serving_size || "",
      protein,
      carbs,
      fat
    };
  }

  async function startBarcodeScan() {
    if (barcodeActive) return;
    barcodeActive = true;

    await startScanCamera();

    try {
      if (!zxingReader) zxingReader = new ZXingBrowser.BrowserMultiFormatReader();

      setScanStatus("Scanning… hold steady.");

      zxingReader.decodeFromVideoElementContinuously(scanVideo, async (result) => {
        if (!barcodeActive) return;
        if (!result) return;

        const code = result.getText();
        barcodeActive = false;
        stopBarcodeScan();

        setScanStatus(`Found: ${code}. Looking up…`);

        try {
          const r = await fetchMacrosFromBarcode(code);
          if (!r.ok) {
            setScanStatus("Not found. Switch to LABEL (OCR).");
            return;
          }

          if (r.name) nameInput.value = r.name;
          if (r.protein != null) proteinInput.value = Math.round(Number(r.protein));
          if (r.carbs != null) carbsInput.value = Math.round(Number(r.carbs));
          if (r.fat != null) fatInput.value = Math.round(Number(r.fat));

          const extra = (r.per === "serving" && r.servingSize) ? `per serving: ${r.servingSize}` : "per 100g";
          setScanStatus(`Filled from barcode (${extra}).`);
        } catch (e) {
          console.error(e);
          setScanStatus("Lookup failed. Try OCR.");
        }
      });
    } catch (e) {
      console.error(e);
      barcodeActive = false;
      setScanStatus("Barcode scan failed. Use OCR.");
    }
  }

  function stopBarcodeScan() {
    barcodeActive = false;
    try { zxingReader?.reset(); } catch {}
  }

  // OCR helpers
  function drawVideoToCanvas() {
    const w = scanVideo.videoWidth || 1280;
    const h = scanVideo.videoHeight || 720;
    scanCanvas.width = w;
    scanCanvas.height = h;
    scanCanvas.getContext("2d").drawImage(scanVideo, 0, 0, w, h);
  }

  function matchGram(text, regex) {
    const m = text.match(regex);
    if (!m) return null;
    for (let i = 1; i < m.length; i++) {
      const v = parseFloat(m[i]);
      if (!Number.isNaN(v)) return v;
    }
    return null;
  }

  function extractMacrosFromText(raw) {
    const t = (raw || "")
      .replace(/\u00A0/g, " ")
      .replace(/[|]/g, " ")
      .replace(/\s+/g, " ")
      .toLowerCase();

    const protein =
      matchGram(t, /(protein)\s*([0-9]+(?:\.[0-9]+)?)\s*g/) ??
      matchGram(t, /([0-9]+(?:\.[0-9]+)?)\s*g\s*(protein)/);

    const fat =
      matchGram(t, /(total fat|fat)\s*([0-9]+(?:\.[0-9]+)?)\s*g/) ??
      matchGram(t, /([0-9]+(?:\.[0-9]+)?)\s*g\s*(total fat|fat)/);

    const carbs =
      matchGram(t, /(total carbohydrate|total carbs|carbohydrate|carbs)\s*([0-9]+(?:\.[0-9]+)?)\s*g/) ??
      matchGram(t, /([0-9]+(?:\.[0-9]+)?)\s*g\s*(total carbohydrate|carbohydrate|carbs)/);

    return { protein, carbs, fat };
  }

  
  function cropCenterCanvas(scale = 0.65) {
    const src = scanCanvas;
    const sw = src.width, sh = src.height;
    if (!sw || !sh) return;

    const cw = Math.max(1, Math.round(sw * scale));
    const ch = Math.max(1, Math.round(sh * scale));
    const sx = Math.max(0, Math.round((sw - cw) / 2));
    const sy = Math.max(0, Math.round((sh - ch) / 2));

    const temp = document.createElement("canvas");
    temp.width = cw;
    temp.height = ch;
    temp.getContext("2d").drawImage(src, sx, sy, cw, ch, 0, 0, cw, ch);

    src.width = cw;
    src.height = ch;
    src.getContext("2d").drawImage(temp, 0, 0);
  }

async function runOCRFromCanvas() {
    if (ocrBusy) return;
    ocrBusy = true;

    try {
      setScanStatus("OCR reading…");
      
      cropCenterCanvas(0.65);
const worker = await Tesseract.createWorker("eng");
      const { data } = await worker.recognize(scanCanvas);
      await worker.terminate();

      const macros = extractMacrosFromText(data?.text || "");

      if (macros.protein != null) proteinInput.value = Math.round(macros.protein);
      if (macros.carbs != null) carbsInput.value = Math.round(macros.carbs);
      if (macros.fat != null) fatInput.value = Math.round(macros.fat);

      if (macros.protein == null && macros.carbs == null && macros.fat == null) {
        setScanStatus("Couldn’t detect macros. Try closer/brighter or UPLOAD.");
        return;
      }

      setScanStatus("Filled from label ✓");
    } catch (e) {
      console.error(e);
      setScanStatus("OCR failed. Try UPLOAD.");
    } finally {
      ocrBusy = false;
    }
  }

  async function loadImageFileToCanvas(fileOrBlob) {
    const img = new Image();
    const url = URL.createObjectURL(fileOrBlob);
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });

    scanCanvas.width = img.naturalWidth;
    scanCanvas.height = img.naturalHeight;
    scanCanvas.getContext("2d").drawImage(img, 0, 0);

    URL.revokeObjectURL(url);
  }

  // Scanner UI wiring
  scanBtn?.addEventListener("click", openScanModal);
  scanCloseBtn?.addEventListener("click", closeScanModal);
  scanTabBarcode?.addEventListener("click", () => setScanMode("barcode"));
  scanTabOCR?.addEventListener("click", () => setScanMode("ocr"));

  scanActionBtn?.addEventListener("click", async () => {
    if (scanMode === "barcode") {
      await startBarcodeScan();
    } else {
      await startScanCamera();

      const track = scanStream?.getVideoTracks?.()[0];

      if (track && window.ImageCapture) {
        try {
          const imageCapture = new ImageCapture(track);
          const blob = await imageCapture.takePhoto(); // higher-res still
          await loadImageFileToCanvas(blob);
        } catch (err) {
          // fallback to a video frame
          drawVideoToCanvas();
        }
      } else {
        drawVideoToCanvas();
      }

      stopScanCamera(); // frees camera during OCR (helps iOS)
      await runOCRFromCanvas();
    }
  });

  scanUploadBtn?.addEventListener("click", () => scanPhotoInput.click());
  scanPhotoInput?.addEventListener("change", async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;

    try {
      setScanStatus("Loading photo…");
      await loadImageFileToCanvas(file);
      await runOCRFromCanvas();
    } catch (err) {
      console.error(err);
      setScanStatus("Upload failed. Try a clearer image.");
    } finally {
      scanPhotoInput.value = "";
    }
  });

  // Init
  update();
  populateMealDropdown();
</script>

<script>
  // PWA: register service worker (KEEP ONLY ONCE — was duplicated before)
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(console.error);
    });
  }
</script>


<script>
(() => {
  const KEY = "mm_profile_small_v1";
  const modal = document.getElementById("mmProfileModal");
  const input = document.getElementById("mmUsername");
  const btn = document.getElementById("mmProfileSave");

  const open = () => {
    modal.classList.add("show");
    document.body.style.overflow = "hidden";
  };

  const close = () => {
    modal.classList.remove("show");
    document.body.style.overflow = "";
  };

  const getProfile = () => {
    try { return JSON.parse(localStorage.getItem(KEY) || "null"); }
    catch { return null; }
  };

  const setProfile = (username) => {
    localStorage.setItem(KEY, JSON.stringify({
      username,
      createdAt: new Date().toISOString()
    }));
  };

  btn?.addEventListener("click", () => {
    const name = (input.value || "").trim();
    if (name.length < 2) return;
    setProfile(name);
    close();
  });

  window.addEventListener("load", () => {
    const p = getProfile();
    if (!p || !p.username) open();
  });
})();
</script>
