<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Install Macro Matrix</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Background container */
    #bgArt {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      z-index: 0;
    }

    /* Cinematic zoom animation */
    #bgArt img {
      width: min(620px, 92vw);
      height: auto;
      opacity: 0;
      image-rendering: pixelated;
      transform-origin: center;
      animation: zoomPulse 10s cubic-bezier(0.4, 0.0, 0.2, 1) 2 forwards;
    }

    @keyframes zoomPulse {
      0% {
        opacity: 0;
        transform: scale(0.6);
      }

      18% {
        opacity: 0.75;
        transform: scale(1);
      }

      50% {
        opacity: 0.75;
        transform: scale(1.08);
      }

      75% {
        opacity: 0.35;
        transform: scale(0.9);
      }

      100% {
        opacity: 0;
        transform: scale(0.65);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #bgArt img {
        animation: none;
        opacity: 0.4;
        transform: scale(1);
      }
    }
  </style>
</head>

<body class="bg-black text-white min-h-screen font-mono flex items-center justify-center p-6">

  <!-- Background Image -->
  <div id="bgArt">
    <img src="/mcdonalds-pixel.jpg" alt="" />
  </div>

  <!-- Foreground Content -->
  <div class="relative z-10 max-w-xl w-full border border-white p-8 space-y-6">

    <h1 class="text-2xl tracking-widest text-center">
      INSTALL MACRO MATRIX
    </h1>

    <p class="text-gray-400 text-center">
      iPhone setup (Safari only).
    </p>

    <div class="text-sm">
      <ol class="list-decimal ml-5 space-y-1 text-gray-300">
        <li>Open Macro Matrix in Safari</li>
        <li>Tap the Share icon</li>
        <li>Select <strong>Add to Home Screen</strong></li>
        <li>Tap Add</li>
      </ol>
    </div>

    <div class="text-center pt-2">
      <a href="/" class="border border-white px-6 py-3 hover:bg-white hover:text-black transition">
        ← Back to Macro Matrix
      </a>
    </div>

  </div>

</body>
</html>
