<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Install Macro Matrix</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
/* Background */
#bgArt {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

/* Windows 98 crunchy stepped zoom */
#bgArt img {
  width: min(620px, 92vw);
  height: auto;
  opacity: 0;
  image-rendering: pixelated;
  transform-origin: center;
  filter: contrast(1.15) saturate(1.05);
  animation: win98Zoom 10s steps(14, end) 2 forwards;
}

/* Stepped appear → zoom → disappear */
@keyframes win98Zoom {
  0%   { opacity: 0;   transform: scale(0.35); }
  15%  { opacity: 0.7; transform: scale(0.75); }
  30%  { opacity: 0.9; transform: scale(1.05); }
  55%  { opacity: 0.9; transform: scale(1.1); }
  75%  { opacity: 0.4; transform: scale(0.85); }
  100% { opacity: 0;   transform: scale(0.4); }
}

/* Canvas */
#dust {
  position: absolute;
  inset: 0;
}

@media (prefers-reduced-motion: reduce) {
  #bgArt img {
    animation: none;
    opacity: 0.4;
    transform: scale(1);
  }
}
</style>
</head>

<body class="bg-black text-white min-h-screen font-mono flex items-center justify-center p-6">

<div id="bgArt">
  <canvas id="dust"></canvas>
  <img id="meal" src="/mcdonalds-pixel.jpg" alt="">
</div>

<div class="relative z-10 max-w-xl w-full border border-white p-8 space-y-6">

  <h1 class="text-2xl tracking-widest text-center">
    INSTALL MACRO MATRIX
  </h1>

  <p class="text-gray-400 text-center">
    iPhone setup (Safari only).
  </p>

  <ol class="list-decimal ml-5 text-gray-300 text-sm space-y-1">
    <li>Open Macro Matrix in Safari</li>
    <li>Tap the Share icon</li>
    <li>Select <strong>Add to Home Screen</strong></li>
    <li>Tap Add</li>
  </ol>

  <div class="text-center pt-2">
    <a href="/" class="border border-white px-6 py-3 hover:bg-white hover:text-black transition">
      ← Back to Macro Matrix
    </a>
  </div>

</div>

<script>
const canvas = document.getElementById("dust");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

/* Same retro palette */
const colors = [
  "#facc15",  // fries yellow
  "#ef4444",  // red
  "#22c55e",  // green
  "#ffffff"
];

const particles = [];
const MAX = 190;

function spawn(burst = false) {
  if (particles.length > MAX) return;

  const size = Math.random() > 0.6 ? 3 : 2;

  particles.push({
    x: W/2 + (Math.random() - 0.5) * 340,
    y: H/2 + (Math.random() - 0.5) * 240,

    // more chaotic velocity but same particle style
    vx: (Math.random() - 0.5) * (burst ? 1.4 : 0.8),
    vy: -Math.random() * (burst ? 1.8 : 1.2) - 0.2,

    wobble: Math.random() * 0.05,
    wobbleOffset: Math.random() * 1000,

    size: size,
    life: 90 + Math.random() * 120,
    color: colors[Math.floor(Math.random()*colors.length)]
  });
}

let frame = 0;

function update() {
  ctx.clearRect(0, 0, W, H);

  frame++;

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    // horizontal wobble = subtle chaos
    p.x += p.vx + Math.sin(frame * p.wobble + p.wobbleOffset) * 0.6;
    p.y += p.vy;
    p.life--;

    ctx.fillStyle = p.color;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);

    if (p.life <= 0) particles.splice(i, 1);
  }

  // steady spawn
  spawn();
  spawn();

  // occasional micro burst
  if (Math.random() > 0.92) {
    for (let i = 0; i < 6; i++) spawn(true);
  }

  requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
