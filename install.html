<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Install Macro Matrix</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Background container */
    #bgArt {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    /* Windows 98-ish: crunchy pixels + step-based zoom */
    #bgArt img {
      width: min(620px, 92vw);
      height: auto;
      opacity: 0;
      image-rendering: pixelated;

      /* crisp, “retro monitor” feel */
      filter: contrast(1.15) saturate(1.05);

      transform-origin: center;
      will-change: transform, opacity, filter;

      /* 10s per cycle, 2 cycles, then stop */
      animation: win98Zoom 10s steps(14, end) 2 forwards;
    }

    /* Appear (zoom in) -> hold -> disappear (zoom out) with “steppy” pixel vibe */
    @keyframes win98Zoom {
      0%   { opacity: 0;   transform: scale(0.35); filter: contrast(1.15) saturate(1.05) brightness(0.95); }
      12%  { opacity: 0.55; transform: scale(0.70); }
      22%  { opacity: 0.75; transform: scale(0.95); }
      32%  { opacity: 0.85; transform: scale(1.05); filter: contrast(1.22) saturate(1.08) brightness(1.05); }

      52%  { opacity: 0.85; transform: scale(1.10); }  /* tiny “max” bump */

      68%  { opacity: 0.55; transform: scale(0.92); }
      80%  { opacity: 0.28; transform: scale(0.70); filter: contrast(1.18) saturate(1.05) brightness(0.98); }
      100% { opacity: 0;   transform: scale(0.42); filter: contrast(1.15) saturate(1.05) brightness(0.95); }
    }

    /* Respect reduced motion */
    @media (prefers-reduced-motion: reduce) {
      #bgArt img {
        animation: none;
        opacity: 0.35;
        transform: scale(1);
      }
    }
  </style>
</head>

<body class="bg-black text-white min-h-screen font-mono flex items-center justify-center p-6">

  <!-- Background Image -->
  <div id="bgArt">
    <img src="/mcdonalds-pixel.jpg" alt="" aria-hidden="true" />
  </div>

  <!-- Foreground Content -->
  <div class="relative z-10 max-w-xl w-full border border-white p-8 space-y-6">

    <h1 class="text-2xl tracking-widest text-center">
      INSTALL MACRO MATRIX
    </h1>

    <p class="text-gray-400 text-center">
      iPhone setup (Safari only).
    </p>

    <div class="text-sm">
      <ol class="list-decimal ml-5 space-y-1 text-gray-300">
        <li>Open Macro Matrix in Safari</li>
        <li>Tap the Share icon</li>
        <li>Select <strong>Add to Home Screen</strong></li>
        <li>Tap Add</li>
      </ol>
    </div>

    <div class="text-center pt-2">
      <a href="/" class="border border-white px-6 py-3 hover:bg-white hover:text-black transition">
        ← Back to Macro Matrix
      </a>
    </div>

  </div>

</body>
</html>
